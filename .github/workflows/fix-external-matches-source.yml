name: One-time external Matches source fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-external-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - prove Matches still uses GitHub Pages relative API
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          start = s.index('async function __cwMtLoadCompetition')
          end = s.index('function __cwMtStopRefresh', start)
          block = s[start:end]
          assert "new URL('/api/cw22/matches',location.origin)" not in block
          PY
          rc=$?
          set -e
          test "$rc" -ne 0
          echo "RED confirmed: Matches loader still depends on relative /api/cw22/matches"

      - name: Patch Matches loader at source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "try{const range=__cwMtSeasonRange(new Date()),url=new URL('/api/cw22/matches',location.origin);url.searchParams.set('competition',key);url.searchParams.set('from',range.from);url.searchParams.set('to',range.to);const response=await fetch(url,{headers:{accept:'application/json','x-telegram-init-data':initData},cache:'no-store'});if(!response?.ok)throw new Error('HTTP '+Number(response?.status||0));const body=await response.json(),payload=body?.data;"
          new = "try{const response=await fetch(__CWPRED_EXTERNAL_API,{method:'POST',headers:{accept:'application/json','content-type':'application/json','x-telegram-init-data':String(initData||'')},body:JSON.stringify({action:'state',competition:key}),cache:'no-store'});const body=await response.json().catch(()=>({}));if(!response?.ok||body?.ok===false)throw new Error(String(body?.error||('HTTP '+Number(response?.status||0))));const payload=body?.data;"
          assert s.count(old) == 1, f'expected exactly one old Matches loader source, got {s.count(old)}'
          assert "const __CWPRED_EXTERNAL_API='https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-external-predictions';" in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: GREEN - verify all external competitions use working API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          start = s.index('async function __cwMtLoadCompetition')
          end = s.index('function __cwMtStopRefresh', start)
          block = s[start:end]
          assert "new URL('/api/cw22/matches',location.origin)" not in block
          assert 'fetch(__CWPRED_EXTERNAL_API' in block
          assert "body:JSON.stringify({action:'state',competition:key})" in block
          assert "body?.data" in block
          assert "key==='serie_a'" in block
          for key in ('coppa_italia','ucl','uel','uecl'):
              assert key in s
          print('GREEN external Matches source contract confirmed')
          PY

      - name: Parse all inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          s = Path('index.html').read_text(encoding='utf-8')
          out = Path('/tmp/ciao-inline-js')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir()
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', s, flags=re.I)
          assert scripts
          for i, body in enumerate(scripts):
              (out / f'{i}.js').write_text(body, encoding='utf-8')
          print(f'inline scripts: {len(scripts)}')
          PY
          for f in /tmp/ciao-inline-js/*.js; do node --check "$f"; done

      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-external-matches-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only | grep -Fx 'index.html'
          git diff --cached --name-only | grep -Fx '.github/workflows/fix-external-matches-source.yml'
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "fix: restore external Matches competitions"
          git push origin HEAD:main
