name: one-time premium rating frontend
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/cw31_rating_frontend.py'
      - '.github/workflows/rating-frontend.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: RED — premium Rating contract must be absent first
        run: python tools/cw31_rating_frontend.py red
      - name: Apply canonical premium Rating patch
        run: python tools/cw31_rating_frontend.py apply
      - name: GREEN — premium Rating contract must pass
        run: python tools/cw31_rating_frontend.py green
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          checked=0
          for i,src in enumerate(scripts):
              if not src.strip(): continue
              p=Path('/tmp')/f'cw_inline_{i}.js'
              p.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(f'inline script {i} failed')
                  print(r.stdout); print(r.stderr)
                  sys.exit(r.returncode)
              checked+=1
          print(f'node --check PASS: {checked} inline scripts')
          PY
      - name: Verify Predictions picker source untouched
        run: |
          grep -q 'ciao-v29-native-score-picker-20260908' index.html
          grep -q 'id="cw29-score-picker"' index.html
          ! grep -q 'id="cw28-score-picker"' index.html
          echo 'cw29 picker invariant PASS'
      - name: Commit Rating patch and remove one-time frontend tooling
        run: |
          rm -f tools/cw31_rating_frontend.py .github/workflows/rating-frontend.yml
          git config user.name 'godievda-pixel'
          git config user.email 'godievda@gmail.com'
          git add index.html tools/cw31_rating_frontend.py .github/workflows/rating-frontend.yml
          git commit -m 'feat: add premium competition rating UI'
          git push origin HEAD:main
