name: One-time Matches card parity

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  matches-card-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - Matches cards do not yet match Predictions
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          desired='#ciao-miniapp-root .cwmt-hub{padding-top:2px}#ciao-miniapp-root .cwmt-hub-title{margin-bottom:12px}#ciao-miniapp-root .cwmt-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}#ciao-miniapp-root .cwmt-tournament-card{position:relative;min-width:0;min-height:116px;padding:18px 16px;border:1px solid rgba(255,255,255,.10);border-radius:20px;overflow:hidden;text-align:left;color:#fff;background:#10182b;box-shadow:0 14px 34px rgba(0,0,0,.22);isolation:isolate}#ciao-miniapp-root .cwmt-tournament-card::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.15),transparent 34%)}#ciao-miniapp-root .cwmt-tournament-card::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.66),transparent);opacity:.65}#ciao-miniapp-root .cwmt-tournament-card span{display:block;max-width:86%;font-size:17px;font-weight:900;line-height:1.08;letter-spacing:-.02em}#ciao-miniapp-root .cwmt-tournament-card i{position:absolute;right:15px;bottom:14px;font:900 22px/1 inherit;font-style:normal;opacity:.82}#ciao-miniapp-root .cwmt-tournament-card--wide{grid-column:1/-1;min-height:126px}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="serie-a"]{background:radial-gradient(circle at 78% 5%,rgba(90,119,255,.38),transparent 38%),linear-gradient(145deg,#122b84,#071331)}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="coppa"]{background:radial-gradient(circle at 15% 5%,rgba(21,148,87,.33),transparent 36%),radial-gradient(circle at 95% 90%,rgba(159,36,53,.30),transparent 38%),linear-gradient(145deg,#13231d,#101313)}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="champions"]{background:radial-gradient(circle at 78% 4%,rgba(83,103,230,.42),transparent 40%),linear-gradient(145deg,#171c56,#080d2c)}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="europa"]{background:radial-gradient(circle at 82% 5%,rgba(230,106,19,.40),transparent 42%),linear-gradient(145deg,#291207,#100905)}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="conference"]{background:radial-gradient(circle at 82% 5%,rgba(40,169,104,.38),transparent 42%),linear-gradient(145deg,#0c2d1d,#06130d)}'
          assert desired in s
          PY
          rc=$?
          set -e
          test "$rc" -ne 0
          echo 'RED confirmed: Matches cards differ from Predictions'

      - name: Patch existing cwmt styles in index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start='#ciao-miniapp-root .cwmt-hub{padding-top:2px}'
          end='#ciao-miniapp-root .cwmt-cover{'
          i=s.index(start)
          j=s.index(end,i)
          desired='#ciao-miniapp-root .cwmt-hub{padding-top:2px}#ciao-miniapp-root .cwmt-hub-title{margin-bottom:12px}#ciao-miniapp-root .cwmt-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}#ciao-miniapp-root .cwmt-tournament-card{position:relative;min-width:0;min-height:116px;padding:18px 16px;border:1px solid rgba(255,255,255,.10);border-radius:20px;overflow:hidden;text-align:left;color:#fff;background:#10182b;box-shadow:0 14px 34px rgba(0,0,0,.22);isolation:isolate}#ciao-miniapp-root .cwmt-tournament-card::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.15),transparent 34%)}#ciao-miniapp-root .cwmt-tournament-card::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.66),transparent);opacity:.65}#ciao-miniapp-root .cwmt-tournament-card span{display:block;max-width:86%;font-size:17px;font-weight:900;line-height:1.08;letter-spacing:-.02em}#ciao-miniapp-root .cwmt-tournament-card i{position:absolute;right:15px;bottom:14px;font:900 22px/1 inherit;font-style:normal;opacity:.82}#ciao-miniapp-root .cwmt-tournament-card--wide{grid-column:1/-1;min-height:126px}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="serie-a"]{background:radial-gradient(circle at 78% 5%,rgba(90,119,255,.38),transparent 38%),linear-gradient(145deg,#122b84,#071331)}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="coppa"]{background:radial-gradient(circle at 15% 5%,rgba(21,148,87,.33),transparent 36%),radial-gradient(circle at 95% 90%,rgba(159,36,53,.30),transparent 38%),linear-gradient(145deg,#13231d,#101313)}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="champions"]{background:radial-gradient(circle at 78% 4%,rgba(83,103,230,.42),transparent 40%),linear-gradient(145deg,#171c56,#080d2c)}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="europa"]{background:radial-gradient(circle at 82% 5%,rgba(230,106,19,.40),transparent 42%),linear-gradient(145deg,#291207,#100905)}#ciao-miniapp-root .cwmt-tournament-card[data-cwmt-theme="conference"]{background:radial-gradient(circle at 82% 5%,rgba(40,169,104,.38),transparent 42%),linear-gradient(145deg,#0c2d1d,#06130d)}'
          s=s[:i]+desired+s[j:]
          old_media='@media(max-width:340px){#ciao-miniapp-root .cwmt-grid{grid-template-columns:1fr}#ciao-miniapp-root .cwmt-tournament-card--wide{grid-column:auto}}'
          new_media='@media(max-width:390px){#ciao-miniapp-root .cwmt-grid{gap:8px}#ciao-miniapp-root .cwmt-tournament-card{min-height:104px;padding:15px 13px;border-radius:18px}#ciao-miniapp-root .cwmt-tournament-card--wide{min-height:112px}#ciao-miniapp-root .cwmt-tournament-card span{font-size:15px}}'
          assert s.count(old_media)==1, f'expected one old mobile rule, got {s.count(old_media)}'
          s=s.replace(old_media,new_media,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: GREEN - verify card parity contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            '.cwmt-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}',
            '.cwmt-tournament-card{position:relative;min-width:0;min-height:116px;padding:18px 16px;border:1px solid rgba(255,255,255,.10);border-radius:20px',
            '.cwmt-tournament-card::before{content:"";',
            '.cwmt-tournament-card::after{content:"";',
            '.cwmt-tournament-card span{display:block;max-width:86%;font-size:17px;font-weight:900;line-height:1.08;letter-spacing:-.02em}',
            '.cwmt-tournament-card i{position:absolute;right:15px;bottom:14px;font:900 22px/1 inherit;',
            '.cwmt-tournament-card--wide{grid-column:1/-1;min-height:126px}',
            '.cwmt-tournament-card[data-cwmt-theme="serie-a"]{background:radial-gradient(circle at 78% 5%',
            '.cwmt-tournament-card[data-cwmt-theme="coppa"]{background:radial-gradient(circle at 15% 5%',
            '.cwmt-tournament-card[data-cwmt-theme="champions"]{background:radial-gradient(circle at 78% 4%',
            '.cwmt-tournament-card[data-cwmt-theme="europa"]{background:radial-gradient(circle at 82% 5%',
            '.cwmt-tournament-card[data-cwmt-theme="conference"]{background:radial-gradient(circle at 82% 5%',
            '@media(max-width:390px){#ciao-miniapp-root .cwmt-grid{gap:8px}'
          ]
          for x in checks: assert x in s, x
          assert '@media(max-width:340px){#ciao-miniapp-root .cwmt-grid{grid-template-columns:1fr}' not in s
          assert 'function __cwMtHubHtml()' in s
          assert 'data-cwmt-competition="serie_a"' in s
          assert 'data-cwmt-competition="coppa_italia"' in s
          assert 'data-cwmt-competition="ucl"' in s
          assert 'data-cwmt-competition="uel"' in s
          assert 'data-cwmt-competition="uecl"' in s
          print('GREEN: Matches hub cards now match Predictions styling')
          PY

      - name: Parse inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          s=Path('index.html').read_text(encoding='utf-8')
          out=Path('/tmp/cw-js')
          shutil.rmtree(out,ignore_errors=True)
          out.mkdir()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,flags=re.I)
          assert scripts, 'no inline scripts found'
          for n,body in enumerate(scripts):
              (out/f'{n}.js').write_text(body,encoding='utf-8')
          print('inline scripts:',len(scripts))
          PY
          for f in /tmp/cw-js/*.js; do node --check "$f"; done

      - name: Commit index only and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/matches-card-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | grep -Fx 'index.html'
          git diff --cached --name-only | grep -Fx '.github/workflows/matches-card-parity.yml'
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'style: match Matches cards to Predictions'
          git push origin HEAD:main
