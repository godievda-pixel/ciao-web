name: Live polling 5s patch

on:
  push:
    paths:
      - '.github/workflows/live-poll-5s.yml'

permissions:
  contents: write

jobs:
  patch-live-polling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RED — 5s live contract must fail before patch
        shell: bash
        run: |
          cat > /tmp/test_live_contract.py <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              "const __CW2014_LIVE_MS=5000,__CW2014_IDLE_MS=60000;",
              "const __CW10_LIVE_POLL_MS=5000,__CW10_IDLE_POLL_MS=180000;",
              "const __CW11_SERIE_A_LIVE_MS=5000,__CW11_SERIE_A_IDLE_MS=600000;",
              "__cwMtRefreshTimer=setInterval(()=>{if(tab==='calendar'&&__cwMtCompetition&&__cwMtCompetition!=='serie_a'&&!document.hidden)__cwMtLoadCompetition(__cwMtCompetition,{quiet:true})},5000)",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise AssertionError('5s live contract missing: ' + ' | '.join(missing))
          if "Date.now()-__cw9LastSectionRefresh>30000" in s:
              raise AssertionError('match-center live sections still use 30s refresh gate')
          PY
          if python /tmp/test_live_contract.py; then
            echo 'RED unexpectedly passed — refusing to patch'
            exit 1
          else
            echo 'RED confirmed: current production does not satisfy the 5s contract'
          fi

      - name: Apply minimal live polling patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("const __CW10_LIVE_POLL_MS=30000,__CW10_IDLE_POLL_MS=180000;", "const __CW10_LIVE_POLL_MS=5000,__CW10_IDLE_POLL_MS=180000;", 1),
              ("const __CW11_SERIE_A_LIVE_MS=30000,__CW11_SERIE_A_IDLE_MS=600000;", "const __CW11_SERIE_A_LIVE_MS=5000,__CW11_SERIE_A_IDLE_MS=600000;", 1),
              ("const __CW2014_LIVE_MS=10000,__CW2014_IDLE_MS=60000;", "const __CW2014_LIVE_MS=5000,__CW2014_IDLE_MS=60000;", 1),
              ("__cwMtRefreshTimer=setInterval(()=>{if(tab==='calendar'&&__cwMtCompetition&&__cwMtCompetition!=='serie_a'&&!document.hidden)__cwMtLoadCompetition(__cwMtCompetition,{quiet:true})},30000)", "__cwMtRefreshTimer=setInterval(()=>{if(tab==='calendar'&&__cwMtCompetition&&__cwMtCompetition!=='serie_a'&&!document.hidden)__cwMtLoadCompetition(__cwMtCompetition,{quiet:true})},5000)", 1),
          ]
          for old, new, expected in replacements:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrence(s), found {count}: {old[:90]}')
              s = s.replace(old, new)
          gate = "Date.now()-__cw9LastSectionRefresh>30000"
          gate_count = s.count(gate)
          if gate_count < 1:
              raise SystemExit('active match-center 30s section gate not found')
          s = s.replace(gate, "Date.now()-__cw9LastSectionRefresh>10000")
          marker = '/* ciao-v32-live-poll-5s-20260908 */'
          if marker not in s:
              s = s.replace('/* ===== /Ciao, Web! v20.14 deterministic live scheduler ===== */', '/* ===== /Ciao, Web! v20.14 deterministic live scheduler ===== */\n  '+marker, 1)
          p.write_text(s, encoding='utf-8')
          print('patched match-center gates:', gate_count)
          PY

      - name: GREEN — 5s live contract
        run: python /tmp/test_live_contract.py

      - name: Inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.I|re.S)
          scripts = [x for x in scripts if x.strip()]
          if not scripts:
              raise SystemExit('no inline scripts found')
          app = max(scripts, key=len)
          Path('/tmp/ciao-main-inline.js').write_text(app, encoding='utf-8')
          print('inline scripts:', len(scripts), 'main bytes:', len(app.encode('utf-8')))
          PY
          node --check /tmp/ciao-main-inline.js

      - name: Commit production patch and self-delete tooling
        shell: bash
        run: |
          git config user.name 'Ciao Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/live-poll-5s.yml
          git add index.html
          git commit -m 'perf: refresh live matches every 5 seconds'
          git push
