name: Tournament tables UI GREEN
on:
  push:
    branches: [tooling/tournament-tables-ui-20260909]
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tournament-tables-20260909
          fetch-depth: 0
      - name: Patch index only
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gunzip > /tmp/cwtt.js
          python - <<'PY2'
          from pathlib import Path
          path=Path('index.html'); text=path.read_text(); marker='ciao-tournament-tables-ui-v1-20260909'; anchor='  /* ciao-v33-external-live-navigation-fix-20260908 */\n'; patch=Path('/tmp/cwtt.js').read_text()
          if marker in text: raise SystemExit('UI marker already exists')
          if text.count(anchor)!=1: raise SystemExit(f'expected one insertion anchor, got {text.count(anchor)}')
          path.write_text(text.replace(anchor,anchor+'\n'+patch+'\n',1))
          PY2
      - name: Verify index contract
        run: |
          python - <<'PY2'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          checks={'ui marker':'ciao-tournament-tables-ui-v1-20260909' in text,'backend endpoint':'functions/v1/ciao-standings-probe' in text,'five tournament cards':text.count('data-cwtt-competition=')==5,'36-team guard':"body.rows.length!==36" in text,'uefa direct zone':'1–8 · 1/8 финала' in text,'uefa playoff zone':'9–24 · стыки' in text,'uefa eliminated zone':'25–36 · вылет' in text,'coppa bracket':'Сетка плей-офф' in text and 'cwtt-bracket' in text,'coppa placeholders':'Пара определится позже' in text,'club navigation':'data-cwtt-club' in text,'match center navigation':"openMatchCenter(id,'external')" in text,'cw29 preserved':'cw29-score-picker' in text}
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('failed checks: '+', '.join(failed))
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I); app=next((s for s in scripts if 'ciao-tournament-tables-ui-v1-20260909' in s),None)
          if not app: raise SystemExit('app script not found')
          Path('/tmp/app.js').write_text(app); print('static checks:',len(checks),'passed')
          PY2
          node --check /tmp/app.js
          git diff --check
          test "$(git status --short | sed -n '1p')" = " M index.html"
          test "$(git status --short | wc -l)" -eq 1
      - name: Commit feature branch
        run: |
          git config user.name 'Ciao Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add tournament tables and Coppa bracket'
          git push origin HEAD:feature/tournament-tables-20260909
