            'no transfer tab':"['transfers','Трансферы']" not in s,
            'api scope':"scope:String(scope||'overall')" in s,
            'scope ui':'data-club-scope=' in s,
            'overall/europe/coppa':'Все турниры' in s and 'Еврокубки' in s and 'Кубок Италии' in s,
            'matches no calendar endpoint':'ciao-club-calendar-fast-v1' not in s,
            'match feed':'cw24-club-match-feed' in s and "section('Ближайший матч',nearest)" in s,
            'premium profile':'cw24-club-hero' in s and '--club-primary:' in s and '--club-secondary:' in s,
            'matches hub parity':'<div class=\\"cwpred-grid\\"><button data-cwmt-competition=\\"serie_a\\" class=\\"cwpred-tournament-card cwpred-tournament-card--wide\\"' in s,
            'matches count':'<h3>Матчи</h3><span>5 турниров</span>' in s,
          }
