          print('GREEN source contracts passed')
          PY
          curl -fsS https://dkefzepiiudehhzbbrjn.supabase.co/functions/v1/ciao-club-profile-fast | python3 -c "import json,sys; j=json.load(sys.stdin); assert j.get('ok') is True; assert j.get('version')==4; assert j.get('multi_tournament') is True; assert j.get('scopes')==['overall','serie_a','europe','coppa']; assert 'transfers' not in j.get('sections',[]); print('backend v4 contract passed')"
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s,re.I)
          if not scripts: raise SystemExit('no inline scripts found')
          checked=0
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              f=Path(tempfile.gettempdir())/f'ciao-inline-{i}.js'
              f.write_text(code)
              r=subprocess.run(['node','--check',str(f)],text=True,capture_output=True)
              if r.returncode:
                  print(r.stdout); print(r.stderr); raise SystemExit(f'inline script {i} syntax failed')
              checked+=1
          print('node --check passed for',checked,'inline scripts')
          PY
