name: One-time club profile v2 rollout
on:
  push:
    paths:
      - '.github/workflows/club-profile-v2-once.yml'
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RED source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "clubViewScope='overall'" not in s, 'scope state already exists; RED is not meaningful'
          assert 'data-club-scope=' not in s, 'scope UI already exists; RED is not meaningful'
          assert "['transfers','Трансферы']" in s, 'transfer tab unexpectedly absent before patch'
          assert '<span>5 турниров</span>' not in s[s.index('function __cwMtHubHtml'):s.index('function __cwMtIsoDate')], 'Matches header already has count'
          print('RED verified: production source does not satisfy the new contract yet')
          PY
      - name: Patch index source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected exactly 1 match, got {n}')
              s=s.replace(old,new,1)

          once(
          "let clubViewId=null,clubViewData=null,clubViewTab='overview',clubReturnSnapshot=null,__cw16ClubLoading=false,__cw16ClubSectionLoading=false,__cw16FavoriteOpen=false,__cw16ClubReturnFromMatch=null,__cw16ClubHistory=[];",
          "let clubViewId=null,clubViewData=null,clubViewTab='overview',clubViewScope='overall',clubReturnSnapshot=null,__cw16ClubLoading=false,__cw16ClubSectionLoading=false,__cw16FavoriteOpen=false,__cw16ClubReturnFromMatch=null,__cw16ClubHistory=[];",
          'club state')
          once(
          "const __cw16ClubTabs=[['overview','Обзор'],['matches','Матчи'],['squad','Состав'],['stats','Статистика'],['transfers','Трансферы']];",
          "const __cw16ClubTabs=[['overview','Обзор'],['matches','Матчи'],['squad','Состав'],['stats','Статистика']];",
          'club tabs')
          once(
          "const __cw16ClubApi=(teamId,sections)=>__cw9Post(__CW16_CLUB_API,{team_id:Number(teamId),sections:Array.isArray(sections)?sections:[]},'Не удалось загрузить клуб');",
          "const __cw16ClubApi=(teamId,sections,scope=clubViewScope)=>__cw9Post(__CW16_CLUB_API,{team_id:Number(teamId),sections:Array.isArray(sections)?sections:[],scope:String(scope||'overall')},'Не удалось загрузить клуб');",
          'club api')
          once(
          "function __cw16MergeClub(base,next){return {...(base||{}),...(next||{}),team:next?.team||base?.team,serie_a:{...(base?.serie_a||{}),...(next?.serie_a||{})},coverage:{...(base?.coverage||{}),...(next?.coverage||{})},errors:{...(base?.errors||{}),...(next?.errors||{})},overview:next?.overview??base?.overview,matches:next?.matches??base?.matches,squad:next?.squad??base?.squad,player_stats:next?.player_stats??base?.player_stats,transfers:next?.transfers??base?.transfers};}",
          "function __cw16MergeClub(base,next){return {...(base||{}),...(next||{}),team:next?.team||base?.team,scope:next?.scope??base?.scope,scope_label:next?.scope_label??base?.scope_label,available_scopes:next?.available_scopes??base?.available_scopes,season_label:next?.season_label??base?.season_label,serie_a:{...(base?.serie_a||{}),...(next?.serie_a||{})},coverage:{...(base?.coverage||{}),...(next?.coverage||{})},errors:{...(base?.errors||{}),...(next?.errors||{})},overview:next?.overview??base?.overview,matches:next?.matches??base?.matches,squad:next?.squad??base?.squad,player_stats:next?.player_stats??base?.player_stats};}",
          'club merge')
          once(
          "function __cw16Loaded(key,d=clubViewData){if(key==='overview')return d?.overview!=null;if(key==='matches')return d?.matches!=null;if(key==='squad')return d?.squad!=null;if(key==='stats')return d?.player_stats!=null;if(key==='transfers')return d?.transfers!=null;return false}",
          "function __cw16Loaded(key,d=clubViewData){if(key==='overview')return d?.overview!=null;if(key==='matches')return d?.matches!=null;if(key==='squad')return d?.squad!=null;if(key==='stats')return d?.player_stats!=null;return false}",
          'club loaded')
          once(
          "if(clubViewTab==='stats')return __cw16StatsHtml(d);if(clubViewTab==='transfers')return __cw16TransfersHtml(d);return __cw16OverviewHtml(d)",
          "if(clubViewTab==='stats')return __cw16StatsHtml(d);return __cw16OverviewHtml(d)",
          'club tab content')

          old_bind=re.search(r"  function __cw16BindClubProfile\(\)\{[^\n]*\}\n  async function loadClubSections\(sections\)\{[^\n]*\}\n  async function openClubProfile\(teamId\)\{[^\n]*\}\n  function closeClubProfile\(\)\{[^\n]*\}\n  async function __cw16OpenMatchFromClub\(mid\)\{[^\n]*\}\n  const __cw16BaseCloseMatchCenter=closeMatchCenter;\n  closeMatchCenter=function\(\)\{[^\n]*\};",s)
          if not old_bind: raise SystemExit('club navigation block not found')
          new_bind=r'''  const __cw16ScopeLabels={overall:'Все турниры',serie_a:'Серия А',europe:'Еврокубки',coppa:'Кубок Италии'};
  function __cw16SectionsForClubTab(key){const out=['overview'];if(key==='matches')out.push('matches');else if(key==='squad')out.push('squad');else if(key==='stats')out.push('stats');return out}
  function __cw16ScopeHtml(d){const a=Array.isArray(d?.available_scopes)&&d.available_scopes.length?d.available_scopes:['overall','serie_a'];return `<div class="cw24-club-scopes" role="tablist" aria-label="Турнир">${a.map(k=>`<button type="button" class="cw24-club-scope ${clubViewScope===k?'active':''}" data-club-scope="${esc(k)}" role="tab" aria-selected="${clubViewScope===k?'true':'false'}">${esc(__cw16ScopeLabels[k]||k)}</button>`).join('')}</div>`}
  function __cw16BindClubProfile(){root.querySelector('#cw16ClubBack')?.addEventListener('click',closeClubProfile);root.querySelectorAll('[data-club-tab]').forEach(b=>b.addEventListener('click',async()=>{const k=String(b.dataset.clubTab||'overview');if(k===clubViewTab)return;clubViewTab=k;render();if(!__cw16Loaded(k))await loadClubSections(__cw16SectionsForClubTab(k))}));root.querySelectorAll('[data-club-scope]').forEach(b=>b.addEventListener('click',async()=>{const k=String(b.dataset.clubScope||'overall');if(k===clubViewScope)return;clubViewScope=k;clubViewData={...(clubViewData||{}),scope:k,scope_label:__cw16ScopeLabels[k]||k,overview:null,matches:null,squad:null,player_stats:null};render();await loadClubSections(__cw16SectionsForClubTab(clubViewTab),true)}));}
  async function loadClubSections(sections,force=false){if(!clubViewId||__cw16ClubSectionLoading)return;const list=[...new Set((sections||[]).map(String).filter(k=>['overview','matches','squad','stats'].includes(k)))],needed=force?list:list.filter(k=>!__cw16Loaded(k));if(!needed.length)return;__cw16ClubSectionLoading=true;render();try{const r=await __cw16ClubApi(clubViewId,needed,clubViewScope);clubViewData=__cw16MergeClub(clubViewData,r);clubViewScope=String(r?.scope||clubViewScope||'overall')}catch(e){clubViewData={...(clubViewData||{}),errors:{...(clubViewData?.errors||{}),[needed[0]]:e.message}};toast(e.message||'Не удалось загрузить данные')}finally{__cw16ClubSectionLoading=false;render()}}
  async function openClubProfile(teamId){const id=Number(teamId);if(!Number.isInteger(id)||id<=0)return;__cw16FavoriteOpen=false;if(clubViewId){if(Number(clubViewId)===id)return;__cw16ClubHistory.push({teamId:clubViewId,data:clubViewData,tab:clubViewTab,scope:clubViewScope,scrollTop:main?.scrollTop??0});}else{clubReturnSnapshot={tab,matchViewId,matchCenterTab,scrollTop:main?.scrollTop??0};__cw16ClubHistory=[];}clubViewId=id;clubViewData=null;clubViewTab='overview';clubViewScope='overall';__cw16ClubLoading=true;__cw16ClubSectionLoading=false;root.classList.remove('match-center-open');root.classList.add('club-profile-open');render();try{clubViewData=await __cw16ClubApi(id,['overview'],clubViewScope);clubViewScope=String(clubViewData?.scope||'overall')}catch(e){clubViewData={__error:e.message||'Не удалось загрузить клуб'}}finally{__cw16ClubLoading=false;render();if(main)main.scrollTop=0}}
  function closeClubProfile(){const prev=__cw16ClubHistory.pop();if(prev){clubViewId=prev.teamId;clubViewData=prev.data;clubViewTab=prev.tab;clubViewScope=prev.scope||'overall';__cw16ClubLoading=false;__cw16ClubSectionLoading=false;render();requestAnimationFrame(()=>{if(main)main.scrollTop=prev.scrollTop||0});return}const snap=clubReturnSnapshot;clubViewId=null;clubViewData=null;clubViewTab='overview';clubViewScope='overall';__cw16ClubLoading=false;__cw16ClubSectionLoading=false;clubReturnSnapshot=null;__cw16ClubHistory=[];root.classList.remove('club-profile-open');if(snap?.matchViewId){matchViewId=snap.matchViewId;matchCenterTab=snap.matchCenterTab||'overview';root.classList.add('match-center-open')}else{root.classList.remove('match-center-open');if(snap?.tab)tab=snap.tab}render();requestAnimationFrame(()=>{if(main&&snap)main.scrollTop=snap.scrollTop||0})}
  async function __cw16OpenMatchFromClub(mid){const id=Number(mid);if(!id)return;__cw16ClubReturnFromMatch={teamId:clubViewId,data:clubViewData,tab:clubViewTab,scope:clubViewScope,outerReturn:clubReturnSnapshot,history:__cw16ClubHistory.slice(),scrollTop:main?.scrollTop??0};clubViewId=null;clubViewData=null;root.classList.remove('club-profile-open');await openMatchCenter(id)}
  const __cw16BaseCloseMatchCenter=closeMatchCenter;
  closeMatchCenter=function(){if(__cw16ClubReturnFromMatch){const s=__cw16ClubReturnFromMatch;__cw16ClubReturnFromMatch=null;matchViewId=null;matchData=null;matchCenterTab='overview';root.classList.remove('match-center-open');clubViewId=s.teamId;clubViewData=s.data;clubViewTab=s.tab;clubViewScope=s.scope||'overall';clubReturnSnapshot=s.outerReturn;__cw16ClubHistory=Array.isArray(s.history)?s.history:[];root.classList.add('club-profile-open');render();requestAnimationFrame(()=>{if(main)main.scrollTop=s.scrollTop||0});return}return __cw16BaseCloseMatchCenter()};'''
          s=s[:old_bind.start()]+new_bind+s[old_bind.end():]

          pat=r"  function __cw17MatchStatus\(m\)\{[\s\S]*?\n  \}"
          rep=r'''  function __cw17MatchStatus(m){
    const st=String(m?.status||m?.live_status||'').toLowerCase(),minute=m?.minute??m?.live_elapsed;
    if(['live','halftime','extra_time','penalties'].includes(st))return `<span class="cw17-match-state live">LIVE${minute!=null?` · ${minute}′`:''}</span>`;
    if(m?.is_finished||st==='finished')return '<span class="cw17-match-state finished">Завершён</span>';
    if(st==='postponed')return '<span class="cw17-match-state upcoming">Перенесён</span>';
    if(st==='cancelled')return '<span class="cw17-match-state upcoming">Отменён</span>';
    return '<span class="cw17-match-state upcoming">Предстоящий</span>';
  }'''
          s,n=re.subn(pat,rep,s,count=1)
          if n!=1: raise SystemExit(f'match status replace {n}')

          pat=r"  __cw16MatchRows=function\(rows,currentId,empty\)\{[\s\S]*?\n  \};\n  __cw16SquadHtml=function\(d\)\{[\s\S]*?\n  \};\n  function __cw17StatMetric"
          rep=r'''  function __cw24CompetitionLabel(m){return m?.competition_label||({serie_a:'Серия А',coppa_italia:'Кубок Италии',ucl:'Лига Чемпионов',uel:'Лига Европы',uecl:'Лига Конференций'})[String(m?.competition||'')]||'Матч'}
  __cw16MatchRows=function(rows,currentId,empty){
    const a=Array.isArray(rows)?rows:[];if(!a.length)return `<div class="mc-empty">${empty}</div>`;
    return `<div class="cw17-match-list">${a.map(m=>{const local=Number(m?.match_id)>0,stage=m?.stage_label||(m?.round_number?`${m.round_number}-й тур`:'');return `<article class="cw17-match-card ${local?'clickable':''}" ${local?`data-club-match="${Number(m.match_id)}"`:''}><div class="cw17-match-meta"><div class="cw24-match-meta-left"><span class="cw24-comp-badge">${esc(__cw24CompetitionLabel(m))}</span>${stage?`<small>${esc(stage)}</small>`:''}</div><time>${m?.kickoff_at?fmt(m.kickoff_at):'Время уточняется'}</time></div><div class="cw17-match-main"><div class="cw17-match-teams">${__cw17TeamCell(m.home,currentId)}${__cw17TeamCell(m.away,currentId)}</div><div class="cw17-match-score"><b>${__cw16ResultScore(m)}</b>${__cw17MatchStatus(m)}</div></div></article>`}).join('')}</div>`;
  };
  __cw16SquadHtml=function(d){
    const s=d?.squad||{},groups=Object.keys(__cw16SquadTitles),scope=d?.scope_label||__cw16ScopeLabels[clubViewScope]||'Все турниры';
    return groups.map(k=>{const rows=Array.isArray(s[k])?s[k]:[];if(!rows.length)return '';return `<section class="cw16-club-section cw16-squad-group"><div class="cw16-squad-title">${__cw16SquadTitles[k]} <span>${__cw11NumWord(rows.length,'игрок','игрока','игроков')}</span></div><div class="cw17-squad-list">${rows.map(p=>{const meta=[__cw17Country(p.nationality),p.age!=null?__cw11NumWord(p.age,'год','года','лет'):null].filter(Boolean).join(' · ');return `<div class="cw16-player-row cw17-squad-row"><div class="cw16-player-num">${p.jersey_number??'—'}</div><div class="cw17-squad-main"><div class="cw16-player-name">${esc(p.name||p.short_name||'Игрок')}</div><div class="cw16-player-meta">${esc(meta||'Данные игрока')}${p.availability&&p.availability!=='available'?' · недоступен':''}</div></div><div class="cw24-squad-metrics"><span><b>${p.appearances??0}</b>М</span><span><b>${p.minutes??0}</b>мин</span><span class="primary"><b>${p.goals??0}</b>Г</span><span class="primary"><b>${p.assists??0}</b>А</span></div></div>`}).join('')}</div><div class="cw24-squad-scope">Статистика · ${esc(scope)}</div></section>`}).join('')||'<div class="mc-empty">Состав пока недоступен</div>';
  };
  function __cw17StatMetric'''
          s,n=re.subn(pat,rep,s,count=1)
          if n!=1: raise SystemExit(f'match/squad replace {n}')

          pat=r"  __cw16StatsHtml=function\(d\)\{[\s\S]*?\n  \};\n  function __cw17TransferList"
          rep=r'''  __cw16StatsHtml=function(d){
    const ps=d?.player_stats||{},p=Array.isArray(ps.players)?ps.players:[],leaders=ps.leaders||{},r=d?.overview?.record||{},scope=d?.scope_label||__cw16ScopeLabels[clubViewScope]||'Все турниры',gd=Number(r?.goal_difference)||0,breakdown=Array.isArray(d?.overview?.competition_breakdown)?d.overview.competition_breakdown:[];
    const team=`<section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Команда</div><div class="cw16-club-section-note">${esc(scope)}</div></div><div class="cw24-team-stats">${__cw17StatMetric('Матчи',r.played??0)}${__cw17StatMetric('Победы',r.won??0,'primary')}${__cw17StatMetric('Ничьи',r.drawn??0)}${__cw17StatMetric('Поражения',r.lost??0)}${__cw17StatMetric('Голы',`${r.goals_for??0}:${r.goals_against??0}`,'primary')}${__cw17StatMetric('Разница',`${gd>0?'+':''}${gd}`)}${__cw17StatMetric('Г/матч',r.goals_per_match??0)}${__cw17StatMetric('Сухие',r.clean_sheets??0)}${__cw17StatMetric('% побед',`${r.win_pct??0}%`,'primary')}</div></section>`;
    const by=clubViewScope==='overall'&&breakdown.length?`<section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">По турнирам</div><div class="cw16-club-section-note">Текущий сезон</div></div><div class="cw24-breakdown">${breakdown.map(x=>`<div><span>${esc(x.label||__cw24CompetitionLabel(x))}</span><b>${Number(x.played)||0}</b><small>${__cw11Plural(Number(x.played)||0,'матч','матча','матчей')}</small></div>`).join('')}</div></section>`:'';
    const lead=`<section class="cw16-club-section cw16-stat-leaders"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Лидеры</div><div class="cw16-club-section-note">${esc(scope)}</div></div><div class="cw24-leaders">${__cw16LeaderCard('Голы',leaders.goals,leaders.goals?.goals??'—')}${__cw16LeaderCard('Ассисты',leaders.assists,leaders.assists?.assists??'—')}${__cw16LeaderCard('Рейтинг',leaders.rating,leaders.rating?.rating!=null?Number(leaders.rating.rating).toFixed(2):'—')}${__cw16LeaderCard('Минуты',leaders.minutes,leaders.minutes?.minutes??'—')}${__cw16LeaderCard('Матчи',leaders.appearances,leaders.appearances?.appearances??'—')}</div></section>`;
    const players=`<section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Статистика игроков</div><div class="cw16-club-section-note">${__cw11NumWord(p.length,'игрок','игрока','игроков')} · ${esc(scope)}</div></div>${p.length?`<div class="cw17-player-stat-list">${p.map(x=>{const rating=x.rating!=null?Number(x.rating).toFixed(2):'—',position=__cw17Position(x.position);return `<article class="cw17-player-stat-card"><div class="cw17-player-stat-head"><div class="cw17-player-id"><span>${x.jersey_number!=null?`#${x.jersey_number}`:'—'}</span><div><b>${esc(x.short_name||x.name||'Игрок')}</b>${position?`<small>${esc(position)}</small>`:''}</div></div><div class="cw17-rating-badge"><b>${rating}</b><span>рейтинг</span></div></div><div class="cw17-player-metrics">${__cw17StatMetric('Матчи',x.appearances??0)}${__cw17StatMetric('Минуты',x.minutes??0)}${__cw17StatMetric('Голы',x.goals??0,'primary')}${__cw17StatMetric('Ассисты',x.assists??0,'primary')}</div>${x.yellow_cards||x.red_cards?`<div class="cw17-player-cards">${x.yellow_cards?`<span>🟨 ${x.yellow_cards}</span>`:''}${x.red_cards?`<span>🟥 ${x.red_cards}</span>`:''}</div>`:''}</article>`}).join('')}</div>`:'<div class="mc-empty">Статистика игроков пока недоступна</div>'}</section>`;
    return team+by+lead+players;
  };
  function __cw17TransferList'''
          s,n=re.subn(pat,rep,s,count=1)
          if n!=1: raise SystemExit(f'stats replace {n}')

          pat=r"  __cw16OverviewHtml=function\(d\)\{[\s\S]*?\n  \};\n  clubProfileHtml=function\(d\)\{[\s\S]*?\n  \};\n  const __cw17BaseRefreshLive"
          rep=r'''  __cw16OverviewHtml=function(d){
    const o=d?.overview||{},r=o?.record||{},v=o?.venue||{},c=o?.coach||{},leaders=o?.leaders||{},cap=Number(v?.capacity),gd=Number(r?.goal_difference)||0,scope=d?.scope_label||__cw16ScopeLabels[clubViewScope]||'Все турниры';
    return `<section class="cw16-club-section cw17-form-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Форма</div><div class="cw16-club-section-note">Последние 5 · ${esc(scope)}</div></div>${__cw16FormHtml(o.form)}</section><section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Сезон</div><div class="cw16-club-section-note">${esc(scope)}</div></div><div class="cw24-season-metrics"><div><span>Матчи</span><b>${r.played??0}</b></div><div><span>Победы</span><b>${r.won??0}</b></div><div><span>Ничьи</span><b>${r.drawn??0}</b></div><div><span>Поражения</span><b>${r.lost??0}</b></div><div class="wide"><span>Голы</span><b>${r.goals_for??0}:${r.goals_against??0}</b><small>Разница ${gd>0?'+':''}${gd}</small></div></div></section>${o?.last_match?`<section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Последний матч</div><div class="cw16-club-section-note">${esc(__cw24CompetitionLabel(o.last_match))}</div></div>${__cw16MatchRows([o.last_match],d.team?.id,'Матчей пока нет')}</section>`:''}${o?.next_match?`<section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Следующий матч</div><div class="cw16-club-section-note">${esc(__cw24CompetitionLabel(o.next_match))}</div></div>${__cw16MatchRows([o.next_match],d.team?.id,'Матч пока не определён')}</section>`:''}<section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Лидеры</div><div class="cw16-club-section-note">${esc(scope)}</div></div><div class="cw16-leaders">${__cw16LeaderCard('Голы',leaders.goals,leaders.goals?.goals??'—')}${__cw16LeaderCard('Ассисты',leaders.assists,leaders.assists?.assists??'—')}${__cw16LeaderCard('Рейтинг',leaders.rating,leaders.rating?.rating!=null?Number(leaders.rating.rating).toFixed(2):'—')}</div></section><section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">О клубе</div><div class="cw16-club-section-note">Текущий сезон</div></div><div class="cw17-club-facts"><div><span>Тренер</span><b>${esc(c?.name||'—')}</b></div><div><span>Стадион</span><b>${esc(v?.name||'—')}</b><small>${esc(v?.city||'')}</small></div><div><span>Вместимость</span><b>${Number.isFinite(cap)&&cap>0?new Intl.NumberFormat('ru-RU').format(cap):'—'}</b></div></div></section>${Array.isArray(o?.injuries)&&o.injuries.length?`<section class="cw16-club-section"><div class="cw16-club-section-head"><div class="cw16-club-section-title">Недоступны</div><div class="cw16-club-section-note">Текущий состав</div></div><div class="cw16-unavailable">${o.injuries.map(p=>`<span>${esc(p.short_name||p.name)}${p.injury_expected_return?` · ориентировочно до ${esc(__cw17FormatDate(p.injury_expected_return))}`:''}</span>`).join('')}</div></section>`:''}`;
  };
  clubProfileHtml=function(d){
    const t=d?.team||__cw16TeamById(clubViewId)||{},sa=d?.serie_a||{},r=d?.overview?.record||{},scope=d?.scope_label||__cw16ScopeLabels[clubViewScope]||'Все турниры',pos=Number(sa?.position)||0,points=Number(sa?.points)||0,serieMeta=clubViewScope==='serie_a'&&pos?`${pos}-е место · ${points} ${__cw11Plural(points,'очко','очка','очков')}`:'';
