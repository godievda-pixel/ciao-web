name: one-time remove duplicate score picker
on:
  push:
    paths:
      - '.github/workflows/fix-picker-duplicate.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED — duplicate picker must violate canonical contract
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '/* ciao-v29-score-picker-source-20260908 */' not in s
          assert s.count('function __cw29PickerOpen(') == 1
          assert 'cw28-score-picker' not in s
          assert 'cw28-picker' not in s
          PY
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'RED unexpectedly passed: production no longer reproduces the bug'
            exit 1
          fi
          echo 'RED confirmed: duplicate late picker implementation breaks the canonical contract'

      - name: Apply minimal duplicate-picker fix
        run: python tools/cw30_remove_duplicate_picker.py

      - name: GREEN — one visible canonical picker remains
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '/* ciao-v29-score-picker-source-20260908 */' not in s
          assert s.count('function __cw29PickerEnsure(') == 1
          assert s.count('function __cw29PickerOpen(') == 1
          assert s.count('function __cw29PickerApply(') == 1
          assert "el.id='cw29-score-picker'" in s
          assert "el.className='cw29-picker'" in s
          assert '.cw29-picker.open{display:block}' in s
          assert 'root.dataset.cw29PickerBound' in s
          assert 'cw28-score-picker' not in s
          assert 'cw28-picker' not in s
          assert s.count('data-cwpred-pick') >= 4
          print('GREEN confirmed: only canonical cw29 picker remains and prediction buttons still target it')
          PY

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os, sys
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,flags=re.I)
          for i,code in enumerate(scripts):
            fd,name=tempfile.mkstemp(suffix='.js'); os.close(fd)
            Path(name).write_text(code,encoding='utf-8')
            r=subprocess.run(['node','--check',name],capture_output=True,text=True)
            os.unlink(name)
            if r.returncode:
              print(f'inline script {i} failed\n{r.stderr}')
              sys.exit(r.returncode)
          print(f'node --check passed for {len(scripts)} inline scripts')
          PY

      - name: Commit production fix and remove one-time tooling
        run: |
          git config user.name godievda-pixel
          git config user.email godievda@gmail.com
          rm -f tools/cw30_remove_duplicate_picker.py .github/workflows/fix-picker-duplicate.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m 'fix: remove duplicate score picker implementation'
          git push origin main
