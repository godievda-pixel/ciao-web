name: one-time compact prediction controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-pred-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: RED — compact controls contract must fail first
        run: |
          if python .github/scripts/fix-compact-pred-controls.py --test; then
            echo 'RED unexpectedly passed'
            exit 1
          else
            echo 'RED failed as expected'
          fi
      - name: Apply compact controls patch
        run: python .github/scripts/fix-compact-pred-controls.py --patch
      - name: GREEN — compact controls contract must pass
        run: python .github/scripts/fix-compact-pred-controls.py --test
      - name: Check inline JavaScript syntax
        run: python .github/scripts/fix-compact-pred-controls.py --check-js
      - name: Commit production patch and remove one-time tooling
        run: |
          git config user.name 'godievda-pixel'
          git config user.email 'godievda@gmail.com'
          git rm .github/workflows/compact-pred-controls.yml .github/scripts/fix-compact-pred-controls.py
          git add index.html
          git commit -m 'fix: compact prediction controls on phones'
          git push origin main
