name: Unify premium loading states

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unify-premium-loading.yml
      - tools/unify_premium_loading.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RED GREEN and syntax verification
        run: python tools/unify_premium_loading.py
      - name: Commit production patch and remove temporary tooling
        run: |
          git config user.name "Ciao Web Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/unify-premium-loading.yml tools/unify_premium_loading.py
          git commit -m "style: unify premium loading states"
          git push
