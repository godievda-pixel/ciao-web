name: one-time fix rating patcher
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-rating-patcher.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix raw-string newline encoding only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/cw31_rating_frontend.py')
          s=p.read_text(encoding='utf-8')
          a=s.count(r"CSS=r'''\n")
          b=s.count(r"JS=r'''\n")
          if a!=1 or b!=1:
              raise SystemExit(f'unexpected raw markers: CSS={a} JS={b}')
          s=s.replace(r"CSS=r'''\n",r"CSS='''\n",1)
          s=s.replace(r"JS=r'''\n",r"JS='''\n",1)
          p.write_text(s,encoding='utf-8')
          print('fixed CSS/JS string newline decoding')
          PY
      - name: Commit fixer and self-delete
        run: |
          rm -f .github/workflows/fix-rating-patcher.yml
          git config user.name 'godievda-pixel'
          git config user.email 'godievda@gmail.com'
          git add tools/cw31_rating_frontend.py .github/workflows/fix-rating-patcher.yml
          git commit -m 'fix: decode rating patch newlines correctly'
          git push origin HEAD:main
