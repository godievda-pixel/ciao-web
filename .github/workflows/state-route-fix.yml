name: one-time canonical state route
on:
  push:
    paths:
      - 'tools/cw32_state_route_fix.py'
      - '.github/workflows/state-route-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RED — state must still use legacy v4 before patch
        run: python tools/cw32_state_route_fix.py red
      - name: Apply canonical state route
        run: python tools/cw32_state_route_fix.py apply
      - name: GREEN — state uses v6 while legacy API_BASE remains v4
        run: python tools/cw32_state_route_fix.py green
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          checked=0
          for i,src in enumerate(scripts):
              if not src.strip(): continue
              p=Path('/tmp')/f'cw_inline_{i}.js'
              p.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(f'inline script {i} failed'); print(r.stdout); print(r.stderr); sys.exit(r.returncode)
              checked+=1
          print(f'node --check PASS: {checked} inline scripts')
          PY
      - name: Verify score picker invariant
        run: |
          grep -q 'ciao-v29-native-score-picker-20260908' index.html
          grep -q "el.id='cw29-score-picker'" index.html
          echo 'cw29 picker invariant PASS'
      - name: Commit fix and self-delete tooling
        run: |
          rm -f tools/cw32_state_route_fix.py .github/workflows/state-route-fix.yml
          git config user.name 'godievda-pixel'
          git config user.email 'godievda@gmail.com'
          git add index.html tools/cw32_state_route_fix.py .github/workflows/state-route-fix.yml
          git commit -m 'fix: route core state through canonical rating backend'
          git push origin HEAD:main
