name: CW33 External Live GREEN
on:
  push:
    paths:
      - 'tools/cw33_patch.py'
      - '.github/workflows/cw33-external-live-green.yml'
  workflow_dispatch:
jobs:
  green:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal production patch
        run: python tools/cw33_patch.py
      - name: GREEN contract
        run: python tools/cw33_external_live_contract.py
      - name: Check every inline JavaScript block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>', text, re.I):
              attrs=m.group(1) or ''
              if 'src=' in attrs.lower():
                  continue
              blocks.append(m.group(2))
          for i,code in enumerate(blocks):
              f=Path('/tmp')/f'cw33-inline-{i}.js'
              f.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          print(f'inline JS syntax GREEN: {len(blocks)} blocks')
          PY
      - name: Preserve working prediction picker
        run: |
          grep -q 'ciao-v29-native-score-picker-20260908' index.html
          grep -q "el.id='cw29-score-picker'" index.html
      - name: Commit production and self-delete temporary tooling
        run: |
          git config user.name 'Ciao Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f tools/cw33_patch.py tools/cw33_external_live_contract.py
          rm -f .github/workflows/cw33-external-live-red.yml .github/workflows/cw33-external-live-green.yml
          git add -A
          git commit -m 'fix: sync external live matches and match center navigation'
          git push origin main
