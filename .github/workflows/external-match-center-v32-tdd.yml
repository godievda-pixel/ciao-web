name: External Match Center v32 TDD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-match-center-v32-tdd.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - external Match Center frontend is absent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'ciao-v32-external-match-center-20260908' not in s
          assert "let matchViewSource='serie_a'" not in s
          assert 'mc-theme-ucl' not in s
          print('RED PASS: source-aware external Match Center is absent')
          PY

      - name: Apply canonical v32 patch
        run: python3 scripts/external_match_center_v32_patch.py

      - name: GREEN - source and regression contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks={
            'v32 marker':s.count('/* ciao-v32-external-match-center-20260908 */')==1,
            'source state':"matchViewSource='serie_a'" in s,
            'summary source':"{source,match_id:Number(id)}" in s,
            'lazy source':"{source,match_id:Number(id),sections,include_split:false}" in s,
            'parallel source':"source:String(body?.source||matchViewSource||'serie_a')" in s,
            'v18 persistence':"matchViewSource:String(matchViewSource||'serie_a')" in s,
            'v22 persistence':"matchSource:String(matchViewSource||'serie_a')" in s,
            'context guard':"if(String(d?.source||d?.match?.source||'serie_a')!=='serie_a')return '';" in s,
            'prefetch guard':"String(matchData?.source||matchData?.match?.source||'serie_a')==='serie_a'" in s,
            'ucl theme':'mc-theme-ucl' in s,
            'uel theme':'mc-theme-uel' in s,
            'uecl theme':'mc-theme-uecl' in s,
            'coppa theme':'mc-theme-coppa' in s,
            'external locator':'data-external-match-id' in s,
            'picker guard':'.cw29-score-pick,#cw29-score-picker,button,[data-cwpred-action],[data-cwpred-pick]' in s,
            'external open':"openMatchCenter(id,'external')" in s,
            'cw29 canonical':s.count("el.id='cw29-score-picker'")>=1,
            'no cw28 picker':'cw28-picker' not in s,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if bad: raise SystemExit('GREEN failures: '+', '.join(bad))
          print('GREEN PASS')
          PY

      - name: Verify inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I)
          kept=0
          for i,(attrs,body) in enumerate(scripts):
              typ=re.search(r'type=["\x27]([^"\x27]+)',attrs,re.I)
              if typ and 'javascript' not in typ.group(1).lower() and 'module' not in typ.group(1).lower():
                  continue
              Path(f'/tmp/ciao-inline-{i}.js').write_text(body)
              kept+=1
          print('inline scripts',kept)
          PY
          for f in /tmp/ciao-inline-*.js; do node --check "$f"; done

      - name: Commit production patch and self-delete tooling
        run: |
          rm -f .github/workflows/external-match-center-v32-tdd.yml scripts/external_match_center_v32_patch.py
          git config user.name "Ciao Web Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add external tournament match centers"
          git push origin main
