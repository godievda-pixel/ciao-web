name: one-time Android predictions fix

on:
  push:
    paths:
      - '.github/patch_android_predictions.py'
      - '.github/workflows/android-predictions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RED — desired contract must fail first
        shell: bash
        run: |
          python .github/patch_android_predictions.py red
          set +e
          python .github/patch_android_predictions.py green
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected GREEN contract to fail before implementation"
            exit 1
          fi
          echo "RED confirmed"
      - name: Apply bounded Android predictions patch
        run: python .github/patch_android_predictions.py patch
      - name: GREEN — desired contract must pass
        run: python .github/patch_android_predictions.py green
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,flags=re.I)
          if not scripts: raise SystemExit('no inline scripts found')
          for i,js in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'ciao-inline-{i}.js'
              p.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'JS syntax PASS: {len(scripts)} inline scripts')
          PY
      - name: Commit production patch and remove one-time tooling
        shell: bash
        run: |
          git config user.name 'godievda-pixel'
          git config user.email 'godievda@gmail.com'
          rm -f .github/patch_android_predictions.py .github/workflows/android-predictions.yml
          git add -A
          git commit -m 'fix: optimize Android prediction controls'
          git push origin main
