name: One-time index migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy the archived app into ciao-web
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/godievda-pixel/ciao-pronostici/main/index.html" -o index.html
          rm -f .github/workflows/migrate-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Migrate Ciao Web index from archive"
          git push origin HEAD:main
