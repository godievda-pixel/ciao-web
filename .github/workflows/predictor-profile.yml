name: one-time premium predictor profile
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/cw32_predictor_profile.py'
      - '.github/workflows/predictor-profile.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: RED — premium predictor profile must be absent first
        run: python tools/cw32_predictor_profile.py red
      - name: Apply premium predictor profile patch
        run: python tools/cw32_predictor_profile.py apply
      - name: GREEN — predictor profile contract must pass
        run: python tools/cw32_predictor_profile.py green
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,src in enumerate(scripts):
              if not src.strip(): continue
              p=Path('/tmp')/f'cw_profile_inline_{i}.js'
              p.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(f'inline script {i} failed'); print(r.stdout); print(r.stderr); sys.exit(r.returncode)
          print('node --check PASS')
          PY
      - name: Verify Rating and Predictions invariants
        run: |
          grep -q 'ciao-v30-premium-rating-20260908' index.html
          grep -q "el.id='cw29-score-picker'" index.html
          ! grep -q 'cw28-score-picker' index.html
          echo 'Rating + cw29 invariants PASS'
      - name: Commit profile patch and remove one-time tooling
        run: |
          rm -f tools/cw32_predictor_profile.py .github/workflows/predictor-profile.yml
          git config user.name 'godievda-pixel'
          git config user.email 'godievda@gmail.com'
          git add index.html tools/cw32_predictor_profile.py .github/workflows/predictor-profile.yml
          git commit -m 'feat: add premium predictor profiles and history'
          git push origin HEAD:main
