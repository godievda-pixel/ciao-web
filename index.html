<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#091BBD">
<meta name="ciao-build" content="ciao-web-fast-cache-v1-20260909">
<title>Ciao, Web!</title>
<style>html,body{margin:0;min-height:100%;background:#030817;color:#fff;font-family:Arial,sans-serif}</style>
</head>
<body>
<script>
(async()=>{
  const CACHE_KEY='ciao-final-html-v7-20260909';
  const LOADER_URL='https://raw.githubusercontent.com/godievda-pixel/ciao-web/c556463b294ae466e16d3e2be06ddf0a65c12a63/index.html';
  const write=html=>{document.open();document.write(html);document.close()};
  try{
    try{
      const cached=localStorage.getItem(CACHE_KEY);
      if(cached&&cached.includes('Ciao, Web!')){write(cached);return}
    }catch(_e){}

    const lr=await fetch(LOADER_URL,{cache:'force-cache'});
    if(!lr.ok)throw new Error('loader '+lr.status);
    const lt=await lr.text();
    const lm=lt.match(/const STABLE='([^']+)',BASE='([^']+)',FIX=("(?:\\.|[^"\\])*");try\{/s);
    if(!lm)throw new Error('loader config missing');
    const STABLE=lm[1],BASE=lm[2],FIX=Function('return '+lm[3])();

    const [vr,br]=await Promise.all([
      fetch(STABLE,{cache:'force-cache'}),
      fetch(BASE,{cache:'force-cache'})
    ]);
    if(!vr.ok||!br.ok)throw new Error('source '+vr.status+'/'+br.status);
    const vt=await vr.text();
    const pm=vt.match(/,PATCH=('(?:\\.|[^'\\])*')/s);
    if(!pm)throw new Error('stable patch missing');
    const VP=Function('return '+pm[1])();
    const src=await br.text();
    const marker='/* ===== /Ciao, Web! v22.5 product polish layer ===== */';
    if(!src.includes(marker))throw new Error('base marker missing');
    const HOTFIX=`/* ciao-v7-table-scope-fix-20260909 */
try{Object.assign(__CW_RU_TEAM_NAMES,{'sabah fk':'Сабах','sabah':'Сабах'})}catch(_e){}
try{
  const __cwV7Render=render;
  render=function(){
    const out=__cwV7Render();
    requestAnimationFrame(()=>{
      try{
        const inTables=!!root.querySelector('.cwtt2-screen');
        if(!inTables)root.removeAttribute('data-cwtt2-theme');
        root.querySelectorAll('.cwtt2-team b,.cwtt2-player small,.cwtt-bracket-team b').forEach(el=>{el.textContent=__cwRuTeamName(el.textContent)});
      }catch(_e){}
    });
    return out;
  };
}catch(_e){}
try{
  const st=document.createElement('style');
  st.id='ciao-v7-table-scope-style';
  st.textContent=`
#ciao-miniapp-root[data-cwtt2-theme]{background:radial-gradient(circle at 50% -10%,rgba(9,27,189,.36),transparent 34%),radial-gradient(circle at 100% 12%,rgba(49,80,255,.12),transparent 28%),linear-gradient(180deg,#040919 0%,#050b1d 46%,#030817 100%)!important}
#ciao-miniapp-root[data-cwtt2-theme] .header{background:linear-gradient(180deg,rgba(3,8,23,.96),rgba(3,8,23,.76) 78%,transparent)!important}
#ciao-miniapp-root .cwtt2-screen{position:relative;isolation:isolate}
#ciao-miniapp-root[data-cwtt2-theme] .cwtt2-screen:before{content:'';position:absolute;z-index:-1;inset:-10px -14px 0;border-radius:20px 20px 0 0;background:linear-gradient(180deg,rgba(var(--cwtt2-rgb,49,80,255),.10),transparent 150px);pointer-events:none}
`;
  document.getElementById(st.id)?.remove();document.head.appendChild(st);
}catch(_e){}
/* /ciao-v7-table-scope-fix-20260909 */`;
    const finalHtml=src.replace(marker,VP+'\n'+FIX+'\n'+HOTFIX+'\n'+marker);
    try{localStorage.setItem(CACHE_KEY,finalHtml)}catch(_e){}
    write(finalHtml);
  }catch(e){
    console.error('ciao fast bootstrap',e);
    document.body.innerHTML='<div style="position:fixed;inset:0;display:grid;place-items:center;color:#8fa0c7;font:12px Arial">Не удалось открыть приложение. Обновите страницу.</div>';
  }
})();
</script>
</body>
</html>
