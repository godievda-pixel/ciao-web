(async()=>{
  const CACHE_KEY='ciao-final-html-v8-20260909';

    const lm=lt.match(/const STABLE='([^']+)',BASE='([^']+)',FIX=("(?:\\.|[^"\\])*");try\{/s);
    if(!lm)throw new Error('loader config missing');
    const STABLE=lm[1],BASE=lm[2],FIX=Function('return '+lm[3])();

    const [vr,br]=await Promise.all([
      fetch(STABLE,{cache:'force-cache'}),
      fetch(BASE,{cache:'force-cache'})
    ]);
    if(!vr.ok||!br.ok)throw new Error('source '+vr.status+'/'+br.status);
    const vt=await vr.text();
    const pm=vt.match(/,PATCH=('(?:\\.|[^'\\])*')/s);
    if(!pm)throw new Error('stable patch missing');
    const VP=Function('return '+pm[1])();
    const src=await br.text();
    const marker='/* ===== /Ciao, Web! v22.5 product polish layer ===== */';
    if(!src.includes(marker))throw new Error('base marker missing');
    const HOTFIX=`/* ciao-v8-live-theme-fix-20260909 */
try{Object.assign(__CW_RU_TEAM_NAMES,{'sabah fk':'Сабах','sabah':'Сабах'})}catch(_e){}

      root.setAttribute('data-cwtt2-theme',t);

    }catch(_e){}
  };
}catch(_e){}

  try{
    const screen=root.querySelector('.cwtt2-screen');
    if(screen){
      const t=String(root.getAttribute('data-cwtt2-theme')||(__CWTT2_THEME?.[__cwTt2Comp])||'serie-a');
      screen.setAttribute('data-cwtt2-theme',t);
      root.removeAttribute('data-cwpred-screen-theme');
    }else{
      root.removeAttribute('data-cwtt2-theme');
    }
    root.querySelectorAll('.cwtt2-team b,.cwtt2-player small,.cwtt-bracket-team b').forEach(el=>{el.textContent=__cwRuTeamName(el.textContent)});
  }catch(_e){}
}
try{
  const __cwV8Render=render;

  const __cwV8Observer=new MutationObserver(()=>requestAnimationFrame(__cwV8ScopeTournamentTheme));
  if(main)__cwV8Observer.observe(main,{childList:true,subtree:false});
}catch(_e){}

/* Match center must never fall into the long idle interval while it is open. */
try{
  __cw2014Tick=async function(){
    let delay=matchViewId?5000:(S?.has_live?5000:15000);
    try{
      if(!document.hidden){
        const r=await refreshLive();
        delay=matchViewId?5000:(S?.has_live?5000:Math.min(15000,Math.max(5000,Number(r?.recommended_poll_ms)||15000)));
      }
    }finally{__cw2014Schedule(delay)}
  };
  __cw2014Wake=function(){
    if(document.hidden)return;
    if(__cw2014Timer)clearTimeout(__cw2014Timer);
    __cw2014Timer=null;
    Promise.resolve(refreshLive()).finally(()=>__cw2014Schedule(matchViewId?5000:(S?.has_live?5000:15000)));
  };
  const __cwV8OpenMatchCenter=openMatchCenter;

  };

}catch(_e){}
